{% extends "base.html" %}
{% block title %}Cambiar mi contraseña{% endblock %}
{% block encabezado %}Cambiar mi contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card-dark">
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for campo in form %}<div class="mb-3">{% include "includes/campo.html" %}</div>{% endfor %}
                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{% url 'courier:perfil' %}" class="btn btn-outline-custom">Cancelar</a>
                        <button type="submit" class="btn btn-primary-custom">Actualizar contraseña</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
